<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Dentalk Icon Generator</title>
<style>body{font-family:sans-serif;display:flex;gap:20px;padding:20px;background:#f0f0f0}
canvas{border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
button{padding:8px 18px;background:#001d4a;color:#fff;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}
p{font-size:12px;color:#555;margin:0}</style>
</head>
<body>
<div class="col">
  <canvas id="c192" width="192" height="192"></canvas>
  <p>192 × 192 px</p>
  <button onclick="dl('c192','icon-192.png')">📥 icon-192.png 다운로드</button>
</div>
<div class="col">
  <canvas id="c512" width="512" height="512"></canvas>
  <p>512 × 512 px</p>
  <button onclick="dl('c512','icon-512.png')">📥 icon-512.png 다운로드</button>
</div>
<script>
function draw(id) {
  var cv = document.getElementById(id);
  var s = cv.width;
  var ctx = cv.getContext('2d');
  var r = s * 0.14;

  // Rounded rect background
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#001d4a';
  ctx.fill();

  // "dentalk" text  — den + t(gold) + alk
  var fs = Math.round(s * 0.30);
  ctx.font = '900 ' + fs + 'px "Arial Black", Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  var y = s * 0.5;
  var x = s * 0.09;

  // Measure full word to center
  ctx.fillStyle = '#ffffff';
  var wDen = ctx.measureText('den').width;
  var wT   = ctx.measureText('t').width;
  var wAlk = ctx.measureText('alk').width;
  var total = wDen + wT + wAlk;
  x = (s - total) / 2;

  ctx.fillStyle = '#ffffff';
  ctx.fillText('den', x, y);
  x += wDen;
  ctx.fillStyle = '#D4AF37';
  ctx.fillText('t', x, y);
  x += wT;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('alk', x, y);
}

draw('c192');
draw('c512');

function dl(id, name) {
  var a = document.createElement('a');
  a.href = document.getElementById(id).toDataURL('image/png');
  a.download = name;
  a.click();
}
</script>
</body>
</html>
